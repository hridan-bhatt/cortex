spring.application.name=cortex-backend

# H2 In-Memory Database (Development)
spring.datasource.url=jdbc:h2:mem:cortexdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

#H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
server.error.include-message=always

# Cortex Application Settings
cortex.project-name=Project Cortex Runtime
cortex.version=1.1
cortex.vaultx-path=../../adapter/VaultX
